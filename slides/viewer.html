      <div class="dot active" data-idx="1" title="Slide 1"></div>
      <div class="dot" data-idx="2" title="Slide 2"></div>
      <div class="dot" data-idx="3" title="Slide 3"></div>
      <div class="dot" data-idx="4" title="Slide 4"></div>
      <div class="dot" data-idx="5" title="Slide 5"></div>
      <div class="dot" data-idx="6" title="Slide 6"></div>
      <div class="dot" data-idx="7" title="Slide 7"></div>
      <div class="dot" data-idx="8" title="Slide 8"></div>
      <div class="dot" data-idx="9" title="Slide 9"></div>
    </div>
  </div>

  <script>
    const TOTAL = 9;
    let current = 1;

    const frames = document.querySelectorAll('.slide-frame');
    const dots = document.querySelectorAll('.dot');
    const counter = document.getElementById('counter');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const scaler = document.getElementById('scaler');
    const viewport = document.getElementById('viewport');

    function goTo(n) {
      n = Math.max(1, Math.min(TOTAL, n));
      if (n === current) return;
      frames[current - 1].classList.remove('active');
      dots[current - 1].classList.remove('active');
      current = n;
      frames[current - 1].classList.add('active');
      dots[current - 1].classList.add('active');
      counter.textContent = current + ' / ' + TOTAL;
      btnPrev.disabled = (current === 1);
      btnNext.disabled = (current === TOTAL);
    }

    function next() { goTo(current + 1); }
    function prev() { goTo(current - 1); }

    btnPrev.addEventListener('click', prev);
    btnNext.addEventListener('click', next);
    btnPrev.disabled = true;

    dots.forEach(dot => {
      dot.addEventListener('click', () => {
        const idx = parseInt(dot.getAttribute('data-idx'), 10);
        goTo(idx);
      });
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        next();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prev();
      } else if (e.key === 'Home') {
        e.preventDefault();
        goTo(1);
      } else if (e.key === 'End') {
        e.preventDefault();
        goTo(TOTAL);
      } else if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    // Fullscreen toggle
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }
    document.getElementById('btn-fs').addEventListener('click', toggleFullscreen);

    // Auto-rescale to fit viewport
    function rescale() {
      const vw = viewport.clientWidth;
      const vh = viewport.clientHeight;
      const slideW = 960;
      const slideH = 540;
      const scale = Math.min((vw - 32) / slideW, (vh - 32) / slideH);
      scaler.style.transform = 'scale(' + Math.max(0.2, scale) + ')';
    }

    window.addEventListener('resize', rescale);
    document.addEventListener('fullscreenchange', () => setTimeout(rescale, 100));
    rescale();
  </script>
